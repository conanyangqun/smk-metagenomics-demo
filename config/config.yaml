# ============================================================
# 宏基因组物种分类流程 (Kraken2 + Bracken) 配置模板
#
# 使用方式: 将本文件复制到你的分析目录(如 analysis/config.yaml)修改，
#           执行: snakemake -s <Snakefile路径> --configfile config.yaml ...
#
# 注意: 本文件中的【相对路径】均相对于执行 snakemake 命令时所在的目录
#       (即你的分析目录)，而不是程序目录；建议数据库与 fastq 使用绝对路径
# ============================================================

# 样本清单文件（TSV），包含列: sample / fastq1 / fastq2 / layout
# layout 取值: paired(双端) / interleaved(双端R1R2交错存于单文件) / single(单端NGS) / long(三代长读长)
samples_file: "samples.tsv"

# 结果输出目录（相对执行目录，可改为绝对路径）
results_dir: "results"

# 日志目录（相对执行目录，可改为绝对路径）
logs_dir: "logs"

# Kraken2 数据库目录（需预先构建或下载，例如 k2_standard_08gb 解压后的目录）
kraken2_db: "/path/to/kraken2_db"

# Bracken 数据库目录（通常与 Kraken2 数据库为同一目录，内含 database*.kmer_distrib）
bracken_db: "/path/to/kraken2_db"

# 物种分类层级: S=种(species), G=属(genus), F=科, O=目, C=纲, P=门
# 注意: Bracken 不支持 D(域)/K(界) 水平的丰度重估
level: "S"

# Bracken 使用的读长（需与数据库 kmer 分布文件匹配）
# Illumina 双端合并后通常为 150；三代数据可先用 reads 长度对应的分布文件，
# 若数据库无对应长度分布，可降低该值（如 100）
read_len: 150

# Bracken 重估时的最小 reads 阈值
threshold: 10

# 每个样本 kraken2 分类所用线程数
threads: 8
